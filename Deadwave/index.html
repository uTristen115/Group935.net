<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deadwave - Hidden Archive Game</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="Deadwave web mini game">
      <canvas id="gameCanvas" width="960" height="640" tabindex="0" aria-label="Deadwave game canvas"></canvas>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="dossier-bar">
        <a class="brand-lockup archive-home" href="./index.html" aria-label="Deadwave home">
          <span class="brand-copy">
            <strong>DEADWAVE</strong>
          </span>
        </a>
        <nav class="archive-tabs" aria-label="Archive sections">
          <a href="../index.html">DATABASE</a>
          <a href="../maps/index.html">MAPS</a>
          <a href="../perks/index.html">PERKS</a>
          <a href="./index.html" class="dossier-red" aria-current="page">DEADWAVE</a>
        </nav>
        <div class="archive-actions">
          <a class="archive-return" href="../index.html">Return to Archive</a>
        </div>
      </div>

      <section class="hud" aria-label="Game status">
        <div class="hud-cluster hud-left">
          <div class="health-frame">
            <span id="healthLabel">100</span>
            <div class="health-track"><div id="healthFill"></div></div>
          </div>
          <div id="perkTray" class="perk-tray" aria-label="Active perks"></div>
        </div>

        <div class="round-chip">
          <span>Round</span>
          <strong id="roundValue">0</strong>
          <small id="roundState">Awaiting breach</small>
        </div>

        <div class="hud-cluster hud-right">
          <div class="points-box"><span>PTS</span><strong id="pointsValue">0</strong></div>
        </div>

        <div class="weapon-box">
          <strong id="weaponName">Rusty Pistol</strong>
          <span id="ammoValue">12 / 60</span>
        </div>

        <div id="prompt" class="prompt" aria-live="polite"></div>
        <div id="notice" class="notice" aria-live="polite"></div>
      </section>

      <section id="overlay" class="overlay is-visible" aria-live="polite">
        <div class="overlay-panel">
          <p id="overlayEyebrow" class="eyebrow">Deadwave - restricted signal</p>
          <h1 id="overlayTitle">Deadwave</h1>
          <p id="overlayText">A concealed archive-side experiment. Hold the room, recover salvage, and document the breach.</p>
          <div class="overlay-actions">
            <button id="primaryButton" type="button">Open File</button>
            <a id="returnButton" class="secondary-button" href="../index.html">Return to Archive</a>
          </div>
          <div id="overlayStats" class="overlay-stats"></div>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
